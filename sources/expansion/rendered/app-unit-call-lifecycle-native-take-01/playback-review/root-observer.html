<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unit call lifecycle — playback review</title><style>body{margin:24px;background:#111827;color:#fff;font:16px system-ui}main{max-width:1200px;margin:auto}h1{font-size:22px}video{width:100%;display:block;background:#000;aspect-ratio:16/9}button{padding:10px 16px;margin:8px 8px 8px 0}pre{white-space:pre-wrap;font-size:13px}small{word-break:break-all}</style><main><h1>Unit: create, select, respond and close a call</h1><p>Exact native-screen take. Use the controls to review actual advancing playback and captions.</p><video id="lesson" controls preload="metadata" playsinline><source src="../app-unit-call-lifecycle-native.mp4" type="video/mp4"><track src="../app-unit-call-lifecycle-native.vtt" kind="captions" srclang="en" label="English" default></video><div><button data-at="12">Beginning</button><button data-at="168">Middle</button><button data-at="316">End</button><button id="observe-playback-state" type="button">Observe playback state</button></div><p id="state">Waiting for media metadata.</p><small>Master SHA-256: d4fcf9c6d7a974b71757d1510508d4666beaef180b16b0bf642cebe3a93c9b78</small><pre id="observation"></pre></main><script>
'use strict';const video=document.getElementById('lesson');const pageErrors=[];window.addEventListener('error',e=>pageErrors.push(String(e.message)));window.addEventListener('unhandledrejection',e=>pageErrors.push(String(e.reason)));const mediaHash='d4fcf9c6d7a974b71757d1510508d4666beaef180b16b0bf642cebe3a93c9b78';
video.addEventListener('loadedmetadata',()=>{for(const track of video.textTracks)track.mode='showing';});
function readPlaybackState(){return {observed_at:new Date().toISOString(),url:location.href,video_sha256:mediaHash,current_time:video.currentTime,duration_seconds:video.duration,paused:video.paused,ended:video.ended,ready_state:video.readyState,network_state:video.networkState,video_width:video.videoWidth,video_height:video.videoHeight,media_error:video.error?{code:video.error.code,message:video.error.message}:null,text_tracks:Array.from(video.textTracks,t=>({kind:t.kind,label:t.label,mode:t.mode,cue_count:t.cues?.length??null,active_cues:Array.from(t.activeCues??[],c=>({start:c.startTime,end:c.endTime,text:c.text}))})),page_errors_observed:pageErrors.slice()};}
window.readPlaybackState=readPlaybackState;video.addEventListener('timeupdate',()=>{document.getElementById('state').textContent=video.currentTime.toFixed(3)+' / '+video.duration.toFixed(3)+' seconds';});document.querySelectorAll('button[data-at]').forEach(b=>b.addEventListener('click',async()=>{video.currentTime=Number(b.dataset.at);try{await video.play();}catch(e){document.getElementById('state').textContent=String(e);}}));window.showPlaybackState=()=>{const s=readPlaybackState();document.getElementById('observation').textContent=JSON.stringify(s,null,2);return s;};
let previousObservedTime=null;
video.addEventListener('seeking',()=>{previousObservedTime=null;});
document.getElementById('observe-playback-state').addEventListener('click',()=>{
 const state=window.showPlaybackState();
 state.previous_time=previousObservedTime;
 previousObservedTime=state.current_time;
 document.getElementById('observation').textContent=JSON.stringify(state,null,2);
});
</script></html>
