resolver 127.0.0.11 valid=10s;
server {
  listen 8080;
  client_max_body_size 50m;
  client_header_buffer_size 16k;
  large_client_header_buffers 4 64k;
  proxy_buffer_size 64k;
  proxy_buffers 4 64k;
  proxy_busy_buffers_size 128k;
  location ~ ^/(api/v4/|connect/|\.well-known/) {
    set $upstream api:8080;
    proxy_pass http://$upstream;
    proxy_set_header Host $http_host;
    proxy_http_version 1.1;
  }
  location ~ ^/(eventingHub|geolocationHub|chatHub) {
    set $upstream eventing:8080;
    proxy_pass http://$upstream;
    proxy_set_header Host $http_host;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
  location /academy-eventing-health/ {
    set $upstream eventing:8080;
    rewrite ^/academy-eventing-health/(.*)$ /health/$1 break;
    proxy_pass http://$upstream;
    proxy_set_header Host $http_host;
  }
  location / {
    set $upstream web:8080;
    proxy_pass http://$upstream;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
server {
  listen 8081;
  client_header_buffer_size 16k;
  large_client_header_buffers 4 64k;
  proxy_buffer_size 64k;
  proxy_buffers 4 64k;
  client_max_body_size 50m;
  location / {
    set $upstream api:8080;
    proxy_pass http://$upstream;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto http;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
server {
  listen 8082;
  location / {
    set $upstream eventing:8080;
    proxy_pass http://$upstream;
    proxy_set_header Host $http_host;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
server {
  listen 8025;
  location / {
    set $upstream mail:8025;
    proxy_pass http://$upstream;
    proxy_set_header Host $http_host;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
server {
  listen 8083;
  location / {
    set $upstream rabbit:15672;
    proxy_pass http://$upstream;
    proxy_set_header Host $http_host;
  }
}
