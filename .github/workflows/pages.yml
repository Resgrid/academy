name: Deploy Resgrid Academy

on:
  push:
    paths:
      - 'site/**'
      - 'sources/**'
      - 'scripts/**'
      - 'pages.json'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'sources/**'
      - 'scripts/**'
      - 'pages.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
    inputs:
      custom_domain:
        description: 'Optional override of the expected hostname stored in pages.json'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: academy-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the Academy repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Test site validation and custom-domain handling
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Build the website from local authoring sources
        run: python3 scripts/build.py
      - name: Audit the public repository for credentials
        run: python3 scripts/audit_public_repo.py --report _reports/public-repo-audit.json
      - name: Validate links, media and publishable files
        run: python3 scripts/validate_site.py --site site --report _reports/pages-validation.json
      - name: Upload the validated website
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out deployment helpers
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /pages.json
      - name: Read GitHub Pages configuration
        id: pages
        uses: actions/configure-pages@v5
      - name: Verify the persistent Academy hostname
        env:
          ACADEMY_CUSTOM_DOMAIN: ${{ inputs.custom_domain || vars.ACADEMY_CUSTOM_DOMAIN || '' }}
          ACADEMY_PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 scripts/check_domain.py --config pages.json
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
