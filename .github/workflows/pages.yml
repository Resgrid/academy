name: Deploy Resgrid Academy

on:
  push:
    paths:
      - 'site/**'
      - 'sources/**'
      - 'scripts/**'
      - 'pages.json'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'sources/**'
      - 'scripts/**'
      - 'pages.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
    inputs:
      custom_domain:
        description: 'Optional override of the expected hostname stored in pages.json'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: academy-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the Academy repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Test current site and authoring guards plus exact historical-tool regressions
        run: python3 scripts/test_academy.py
      - name: Build the complete local website from authoring sources
        run: python3 scripts/build.py --local-preview
      - name: Audit the public repository for credentials
        run: python3 scripts/audit_public_repo.py --report _reports/public-repo-audit.json
      - name: Package the Pages website and SHA256-named Release videos
        env:
          ACADEMY_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/release_media.py package --site site --destination _reports/pages-site --assets _reports/release-media --repository "$ACADEMY_REPOSITORY"
      - name: Validate the final Pages delivery bundle
        run: python3 scripts/validate_site.py --site _reports/pages-site --report _reports/pages-validation.json
      - name: Retain verified videos for the publication job
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-artifact@v7
        with:
          name: academy-release-media
          path: _reports/release-media
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Upload the validated website
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@v4
        with:
          path: _reports/pages-site

  media:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out the verified Release helpers
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - name: Download this run's validated video masters
        uses: actions/download-artifact@v8
        with:
          name: academy-release-media
          path: _reports/release-media
      - name: Upload new videos and verify existing Release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACADEMY_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 scripts/release_media.py upload --assets _reports/release-media --execute

  deploy:
    needs: [validate, media]
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out deployment helpers
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /pages.json
      - name: Read GitHub Pages configuration
        id: pages
        uses: actions/configure-pages@v5
      - name: Verify the persistent Academy hostname
        env:
          ACADEMY_CUSTOM_DOMAIN: ${{ inputs.custom_domain || vars.ACADEMY_CUSTOM_DOMAIN || '' }}
          ACADEMY_PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 scripts/check_domain.py --config pages.json
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
